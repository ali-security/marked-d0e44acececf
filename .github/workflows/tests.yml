name: "Tests"
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional jasmine selector appended to the test commands'
        required: false
        default: ''

jobs:
  Test:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    timeout-minutes: 30
    strategy:
      matrix:
        node_version: ['lts/*', 'node', '14']
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
      - name: Install Node
        uses: dcodeIO/setup-node-nvm@master
        with:
          node-version: ${{ matrix.node_version }}
      - name: Install Dependencies
        run: npm ci
      - name: Run Unit Tests 👩🏽‍💻
        run: |
          set -o pipefail
          npm run test:unit ${{ inputs.test-filter }} | tee jasmine-unit.log
          awk '/^[0-9]+ specs?, [0-9]+ failures?/ { t=$1; f=$3; p=0; if (match($0, /[0-9]+ pending/)) p=substr($0, RSTART, RLENGTH)+0; printf "Jasmine %s summary: %d passed, %d failed, %d pending (of %d specs)\n", SUITE, t-f-p, f, p, t }' SUITE=unit jasmine-unit.log
      - name: Run Spec Tests 👩🏽‍💻
        run: |
          set -o pipefail
          npm run test:specs ${{ inputs.test-filter }} | tee jasmine-specs.log
          awk '/^[0-9]+ specs?, [0-9]+ failures?/ { t=$1; f=$3; p=0; if (match($0, /[0-9]+ pending/)) p=substr($0, RSTART, RLENGTH)+0; printf "Jasmine %s summary: %d passed, %d failed, %d pending (of %d specs)\n", SUITE, t-f-p, f, p, t }' SUITE=specs jasmine-specs.log

  Lint:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
      - name: Install Dependencies
        run: npm ci
      - name: Lint ✨
        run: npm run test:lint

  Release:
    needs: [Test, Lint]
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
      - name: Install Dependencies
        run: npm ci
      - name: Build 🗜️
        run: |
          npm run build
          if ! git diff --quiet; then
            git config --global user.email "<>"
            git config --global user.name "MarkedJS bot"
            git commit -am "🗜️ build [skip ci]"
          fi
      - name: Pack 📦
        run: |
          mkdir -p dist-pack
          npm pack --pack-destination dist-pack
          ls -l dist-pack
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: marked-tgz
          path: dist-pack/*.tgz
          if-no-files-found: error

  Skip:
    if: contains(github.event.head_commit.message, '[skip ci]')
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Skip CI 🚫
        run: echo skip ci
